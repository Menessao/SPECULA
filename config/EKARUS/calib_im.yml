# Interaction Matrix and Reconstructor Calibration
# ================================================

# Push-pull command generator
pushpull:
  class:        'PushPullGenerator'
  nmodes:       300                        # Number of DM actuators
  amp:          3000000
  outputs:   ['output']

# Interaction matrix calibrator
pyr_im_calibrator:
  class:     'ImCalibrator'
  nmodes:    300                         # Number of modes to calibrate
  im_tag:    'pyr5.0_onbench_dm468_im'            # Output IM filename
  overwrite: true                         # Overwrite existing files
  inputs:
    in_slopes:   'pyr_slopes.out_slopes'      # WFS slopes input
    in_commands: 'pushpull.output'        # Push-pull commands

# Override main simulation parameters
main_override:
  time_step: 0.001
  total_time: 0.6                 # 400 modes × 2 (push+pull) × 0.001s

# Disable atmosphere for clean calibration
prop_override:
  source_dict_ref:   ['source_ngs']
  inputs:
    common_layer_list: ['pupilstop', 'dm.out_layer']  # Only pupil + DM
  outputs:           ['out_source_ngs_ef']

# pyr_slopes_override:
#   pupdata_object:         'pyr_pupdata_40x40'  

# Override DM to use calibration commands
dm_override:
  sign: 1                                 # Use positive sign for calibration (default is -1)
  nmodes: 300                            # Use all modes for calibration
  inputs:
    in_command: 'pushpull.output'         # Connect to push-pull generator
  # ifunc_object:      'reordered_unobs_DM468_ifunc'      # Influence functions
  # m2c_object:        'dm468_m2c'        # Modal-to-command matrix

pyr_override:
  # pup_diam:          40.                     # Pupil diameter in subaps.
  # pup_dist:          60.    
  mod_amp: 6.0
  inputs: 
    in_ef: 'prop.out_source_ngs_ef'

# Disable noise for clean measurements
ocam_override:
  dt:             0.001
  photon_noise:   false                   # No photon noise
  readout_noise:  false                   # No read noise
  excess_noise:   false                   # No excess noise

data_store_override:
  class:             'DataStore'
  store_dir:         '/raid1/mmenessini/results/EKARUS'             # Data result directory: 'store_dir'/TN/
  create_tn: false
  inputs:
    input_list: ['calib_frame-ocam.out_pixels',
                  'dm_ef-prop.out_source_ngs_ef']

# Remove unnecessary objects during calibration
remove: ['atmo','seeing','wind_speed','wind_direction','atmo_modes', #'data_store',
        'dm_mode_res','filter','psf', 'ef_prop','pyr_modalrec'] #,'coro_psf'
