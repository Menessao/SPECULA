# Main simulation parameters
main:
  class:             'SimulParams'
  root_dir:          '/raid1/mmenessini/calibration/EKARUS/'       # CalibManager root directory (all the data are in subdirectories)
  pixel_pupil:       160                   # Must match influence function computation
  pixel_pitch:       0.011375             # [m] Pitch of the pupil phase array (1.82m/120pix)
  total_time:        0.0005                   # [s] Total simulation running time
  time_step:         0.0005                 # [s] Simulation time step
  zenithAngleInDeg:  0.0                   # [deg] Zenith observation (0 means no airmass)
  display_server:    false                 # Disable for batch runs

# Natural guide star for WFS
source_ngs:
  class:             'Source'
  polar_coordinates: [0.0, 0.0]            # [arcsec, deg] On-axis NGS
  height:            .inf                  # Infinite height (star)
  magnitude:         1.0                   # R-band magnitude (bright NGS)
  wavelengthInNm:    750                   # [nm] R-band for WFS

# Telescope pupil geometry
pupilstop:
  class:             'Pupilstop'
  tag:               'Copernico_Pupil_160pixels' 

  
# Atmospheric propagation
prop:
  class:             'AtmoPropagation'
  simul_params_ref:  'main'
  source_dict_ref:   ['source_ngs'] 
  inputs:
    atmo_layer_list: []
    common_layer_list: ['pupilstop']       # Pupil
  outputs:           ['out_source_ngs_ef'] 


########################### PWFS ##############################
pyr:
  class:             'ModulatedPyramid'
  simul_params_ref:  'main'
  pup_diam:          38.                     # Pupil diameter in subaps.
  pup_dist:          60.                     # Separation between pupil centers in subaps.
  # pyr_tlt_coeff:     [[1.16145664, 1.11620107, 1.15223466, 1.12545586],
  #                     [0.97246648, 0.95597977, 1.03822003, 1.05478171]]
  pyr_tlt_coeff:     [[1.16145664, 1.11620107, 1.15223466, 1.15],
                      [1.075, 0.95597977, 1.03822003, 0.95]]
  fov:               6.0                     # Requested field-of-view [arcsec]
  mod_amp:           5.0                     # Modulation radius (in lambda/D units)
  output_resolution: 120                      # Output sampling [usually corresponding to CCD pixels]
  wavelengthInNm:    750                     # [nm] Pyramid wavelength
  inputs:
    in_ef: 'prop.out_source_ngs_ef'

ocam:
  class:             'CCD'
  simul_params_ref:  'main'
  size:              [120,120]            # Total detector size
  dt:                0.0005              # [s] Integration time (2000 fps)
  bandw:             300                   # [nm]
  # photon_noise:      true                  # Enable photon noise
  # readout_noise:     true                  # Enable read noise
  # excess_noise:      true                  # Enable excess noise
  photon_noise:      false                  # Enable photon noise
  readout_noise:     false                  # Enable read noise
  excess_noise:      false                  # Enable excess noise
  readout_level:     0.4                   # [e-/pix/frame] Read noise level
  emccd_gain:        600                   # EMCCD gain factor
  quantum_eff:       0.06                   # QE x transmission
  inputs:
    in_i:            'pyr.out_i' 
  outputs:           ['out_pixels']

