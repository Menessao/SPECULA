
# Main simulation parameters
main:
  class:             'SimulParams'
  root_dir:          '/raid1/mmenessini/calibration/EKARUS/'       # CalibManager root directory (all the data are in subdirectories)
  pixel_pupil:       120                   # Must match influence function computation
  pixel_pitch:       0.015167              # [m] Pitch of the pupil phase array (1.82m/120pix)
  total_time:        2.0                   # [s] Total simulation running time
  time_step:         0.001                 # [s] Simulation time step
  zenithAngleInDeg:  0.0                   # [deg] Zenith observation (0 means no airmass)
  display_server:    false                 # Disable for batch runs

# Atmospheric conditions
seeing:
  class:             'WaveGenerator'
  constant:          1.0                  # [arcsec]

wind_speed:
  class:             'WaveGenerator'
  constant:          [15.0, 13.0, 13.0, 9.0, 9.0, 15.0, 25.0, 40.0, 21.0]    # [m/s] Multi-layer wind speeds
  # constant:          [2, 4, 6, 25]    # [m/s] Multi-layer wind speeds

wind_direction:
  class:             'WaveGenerator'
  constant:          [38.0, 34.0, 54.0, 42.0, 57.0, 48.0, -102.0, -83.0, -77.0] # [deg] Wind directions for each layer
  # constant:          [38, 162, -102, -45] # [deg] Wind directions for each layer

# Natural guide star for WFS
source_ngs:
  class:             'Source'
  polar_coordinates: [0.0, 0.0]            # [arcsec, deg] On-axis NGS
  height:            .inf                  # Infinite height (star)
  magnitude:         1.0                   # R-band magnitude (bright NGS)
  wavelengthInNm:    750                   # [nm] R-band for WFS

# Telescope pupil geometry
pupilstop:
  class:             'Pupilstop'
  tag:               'copernico_pupil_120pixels' 

# Multi-layer atmospheric model
atmo:
  class:             'AtmoEvolution'
  simul_params_ref:  'main'
  L0:                25.0                   # [m] Outer scale
  heights:           [42.0, 140.0, 281.0, 562.0, 1125.0, 2250.0, 4500.0, 9000.0, 18000.0] # [m] Ground, mid, high layers at 0 zenith angle
  Cn2:               [0.5328,0.0145,0.035,0.0957,0.1083,0.0437,0.0658,0.0371,0.0671]        # Cn2 fractions (sum = 1.0)
  # heights:           [103, 725, 2637, 11068] # [m] Ground, mid, high layers at 0 zenith angle
  # Cn2:               [0.70, 0.06, 0.14, 0.10]        # Cn2 fractions (sum = 1.0)
  fov:               0.0                    # [arcsec] Field of view
  inputs:
    seeing:          'seeing.output'
    wind_speed:      'wind_speed.output'
    wind_direction:  'wind_direction.output'
  outputs:           ['layer_list']

# Atmospheric propagation
prop:
  class:             'AtmoPropagation'
  simul_params_ref:  'main'
  source_dict_ref:   ['source_ngs'] 
  inputs:
    atmo_layer_list: ['atmo.layer_list']
    common_layer_list: ['pupilstop']       
  outputs:           ['out_source_ngs_ef'] 

perf_prop1:
  class: 'ElectricFieldCombinator'
  inputs:
    in_ef1: 'prop.out_source_ngs_ef'    # Turbulence
    in_ef2: 'perfect_dm1.out_layer'          # DM1 correction
  outputs: ['out_ef']


perfect_dm1:
  class:             'DM'
  simul_params_ref:  'main'
  ifunc_object:      'dm468_ifunc'    # Influence functions
  m2c_object:        'dm468_m2c'       # Modal-to-command matrix
  height:            0                # Ground-conjugated DM
  nmodes:            430
  inputs:
    in_command:      'dm1_mode_res.out_modes'
  outputs:           ['out_layer']

perf_prop2:
  class: 'ElectricFieldCombinator'
  inputs:
    in_ef1: 'perf_prop1.out_ef'    # Turbulence
    in_ef2: 'perfect_dm2.out_layer'          # DM1 correction
  outputs: ['out_ef']


perfect_dm2:
  class:             'DM'
  simul_params_ref:  'main'
  ifunc_object:      'dm241_ifunc'    # Influence functions
  m2c_object:        'dm241_m2c'       # Modal-to-command matrix
  height:            0                # Ground-conjugated DM
  nmodes:            0
  inputs:
    in_command:      'dm2_mode_res.out_modes'
  outputs:           ['out_layer']


###########################################################
##################### POST-PROCESSING #####################
# Coronagraphic and non-coronagraphic PSFs
coro_psf:
  class:             'PsfCoronagraph'
  simul_params_ref:  'main'
  wavelengthInNm:    1450                 # [nm] visible
  nd:                4                   # 4x padding for PSF
  start_time:        0.0                 # Start PSF integration after 500ms
  verbose: false
  use_average_field: true
  compute_profile_metrics: true
  inputs:
    in_ef:           'perf_prop2.out_ef' 

dm1_mode_res:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'dm468_kl_inv'
  nmodes:            430
  inputs:
    in_ef: ['prop.out_source_ngs_ef']
  outputs: ['out_modes']

dm2_mode_res:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'dm241_kl_inv'
  nmodes:            0
  inputs:
    in_ef: ['perf_prop1.out_ef']
  outputs: ['out_modes']

# Data store for results
data_store:
  class:             'DataStore'
  store_dir:         '/raid1/mmenessini/results/EKARUS'             # Data result directory: 'store_dir'/TN/
  inputs:
    input_list: [
                  # 'atmo_phase-perf_prop.out_ef',
                  'coro_psf_int_profile-coro_psf.out_int_coronagraph_psf_profile',
                  'coro_psf_std_profile-coro_psf.out_std_coronagraph_psf_profile',
                  ]

# remove: ['']
