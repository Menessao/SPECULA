# Synthetic interaction matrix in partial correction
# ================================================

# Push-pull command generator
pushpull:
  class:        'PushPullGenerator'
  nmodes:       500                         # Number of DM actuators
  amp:          50  
  ncycles:       40
  repeat_full_sequence: true
  # constant_amp: true
  outputs:   ['output']

# Interaction matrix calibrator
pyr_im_calibrator:
  class:     'ImCalibrator'
  nmodes:    500                         # Number of modes to calibrate
  im_tag:    'pyr3.0_s1.0_c20260506_092825_ogc_im'            # Output IM filename
  overwrite: true                         # Overwrite existing files
  inputs:
    in_slopes:   'pyr_slopes.out_slopes'      # WFS slopes input
    in_commands: 'pushpull.output'        # Push-pull commands

# Override main simulation parameters
main_override:
  total_time: 23.52                # 500 modes × 2 (push+pull) × 0.000588s x 40 cycles

################################## ATMO RESIDUAL #####################################
seeing_random:
  class:             'RandomGenerator'
  amp:               0.0                 # Variation amplitude [arcsec]
  constant:          1.0                 # Mean seeing [arcsec]
  distribution:      'UNIFORM'           # 
  outputs: ['output']

# Random atmospheric phase generator
atmo_random:
  class:                'AtmoRandomPhase'
  simul_params_ref:     'main'
  L0:                   25               # [m] Outer scale
  source_dict_ref:      ['source_ngs']
  update_interval:      1000                 # Update after push-pull of all modes
  inputs:
    seeing:             'seeing_random.output'
    pupilstop:          'pupilstop'
  outputs:              ['out_source_ngs_ef']

# Modal decomposition of atmospheric phase
modal_analysis_random:
  class: 'ModalAnalysis'
  ifunc_inv_object: 'asm_v30dx_ifunc_inv'
  nmodes: 648
  inputs:
    in_ef: 'atmo_random.out_source_ngs_ef'
  outputs: ['out_modes']

scale_random:
  class:  'BaseOperation'
  constant_mul_data: 'correction_vector_20260506_092825' 
  inputs:
    in_value1: 'modal_analysis_random.out_modes'
  outputs: ['out_value']

# DM applying partial correction
dm_random:
  class: 'DM'
  simul_params_ref:  'main'
  ifunc_object:      'asm_v30dx_ifunc'      # Our computed influence functions
  m2c_object:        'asm_v30dx_m2c'        # Modal-to-command matrix
  height:            0.0                # Ground-conjugated DM
  inputs:
    in_command: 'scale_random.out_value'
  outputs: ['out_layer']

atmo_pc:
  class: 'ElectricFieldCombinator'
  inputs:
    in_ef1: 'atmo_random.out_source_ngs_ef'    # Turbulence
    in_ef2: 'dm_random.out_layer'              # Partial correction
  outputs: ['out_ef']

ef_mode:
  class: 'ElectricFieldCombinator'
  inputs:
    in_ef1: 'atmo_pc.out_ef'    # Partially corrected turbulence
    in_ef2: 'dm.out_layer'      # Mode amplitudes
  outputs: ['out_ef']


# Override DM to use calibration commands
dm_override:
  sign: 1                                 # Use positive sign for calibration (default is -1)
  nmodes: 500                            # Use all modes for calibration
  inputs:
    in_command: 'dm_commands.out_value'         # Connect to push-pull generator

pyr_override:
  inputs: 
    in_ef: 'ef_mode.out_ef'

# Disable noise for clean measurements
ocam_override:
  photon_noise:   false                   # No photon noise
  readout_noise:  false                   # No read noise
  excess_noise:   false                   # No excess noise

atmo_pc_modes:
  class: 'ModalAnalysis'
  ifunc_inv_object: 'asm_v30dx_kl_inv'
  inputs:
    in_ef: 'atmo_pc.out_ef'
  outputs: ['out_modes']

############################################################################################
dm_commands:
  class: 'BaseOperation'
  sum: true
  inputs:
    in_value1: 'pushpull.output'
    in_value2: 'og_modulator.output'

og_modulator:
  class:             'WaveGenerator'
  wave_type:         'SIN'
  amp:               [20.0]
  freq:              [50.0]
  vsize:             500
  mode_numbers:      [30]
  outputs: ['output']

demodulator1:
  class:                'Demodulator'
  simul_params_ref:     'main'
  mode_numbers:         [30]
  carrier_frequencies:  [50.0]
  demod_dt:             0.2352
  inputs:
      in_data: 'og_modulator.output'
  outputs: ['output']

demodulator2:
  class:                'Demodulator'
  simul_params_ref:     'main'
  mode_numbers:         [30]
  carrier_frequencies:  [50.0]
  demod_dt:             0.2352
  inputs:
      in_data: 'pyr_modalrec.out_modes'
  outputs: ['output']

optical_gain_estimator:
  class:             'OpticalGainEstimator'
  gain:                   1.0
  initial_optical_gain:   1.0
  inputs:
    in_demod_delta_command: 'demodulator2.output'
    in_demod_command: 'demodulator1.output'
  outputs: ['output','optical_gain']

############################################################################################

data_store_override:
  inputs:
    input_list: ['atmo_res-atmo_pc_modes.out_modes','demod2-demodulator2.output','demod1-demodulator1.output','omg-dm_commands.out_value','optg-optical_gain_estimator.optical_gain']

# Remove unnecessary objects during calibration
remove: ['atmo','seeing','wind_speed','wind_direction','atmo_modes', #'data_store', #'source_science',
        'dm_mode_res','filter','psf', 'ef_prop', 'prop'] #, 'bootstrap', 'concat_wfs_modes'
