# Synthetic interaction matrix in partial correction
# ================================================
main:
  class:             'SimulParams'
  root_dir:          '/raid1/mmenessini/calibration/SOUL/KLv30dx'       # CalibManager root directory (all the data are in subdirectories)
  pixel_pupil:       197                   # Must match influence function computation
  pixel_pitch:       0.041736           # [m] Pitch of the pupil phase array
  total_time:        84.0               # [s] Total simulation running time
  time_step:         0.001              # [s] Simulation time step
  zenithAngleInDeg:  0.0                   # [deg] Zenith observation (0 means no airmass)
  display_server:    false                 # Disable for batch runs

# Push-pull command generator
pushpull:
  class:        'PushPullGenerator'
  nmodes:       600                         # Number of DM actuators
  amp:          25  
  ncycles:       70
  repeat_full_sequence: true
  outputs:   ['output']

# Interaction matrix calibrator
pyr_im_calibrator:
  class:     'ImCalibrator'
  nmodes:    600                         # Number of modes to calibrate
  im_tag:    'pyr0.0_s1.0_synim_LowAmp_pcinf'            # Output IM filename
  overwrite: true                         # Overwrite existing files
  inputs:
    in_slopes:   'pyr_slopes.out_slopes'      # WFS slopes input
    in_commands: 'pushpull.output'        # Push-pull commands

source_ngs:
  class:             'Source'
  polar_coordinates: [0.0, 0.0]            # [arcsec, deg] On-axis NGS
  height:            .inf                  # Infinite height (star)
  magnitude:         9.5                   # R-band magnitude (bright NGS)
  wavelengthInNm:    750                   # [nm] R-band for WFS

# Telescope pupil geometry
pupilstop:
  class:             'Pupilstop'
  tag:               'asm_v30dx_197pixels_optshift'


################################## ATMO RESIDUAL #####################################
seeing_random:
  class:             'RandomGenerator'
  amp:               0.0                 # Variation amplitude [arcsec]
  constant:          1.0                 # Mean seeing [arcsec]
  distribution:      'UNIFORM'           # 
  outputs: ['output']

# Random atmospheric phase generator
atmo_random:
  class:                'AtmoRandomPhase'
  simul_params_ref:     'main'
  L0:                   25               # [m] Outer scale
  source_dict_ref:      ['source_ngs']
  update_interval:      1200                 # Update after push-pull of all modes
  inputs:
    seeing:             'seeing_random.output'
    pupilstop:          'pupilstop'
  outputs:              ['out_source_ngs_ef']

# Modal decomposition of atmospheric phase
modal_analysis_random:
  class: 'ModalAnalysis'
  ifunc_inv_object: 'asm_v30dx_ifunc_shift_inv'
  nmodes: 649
  inputs:
    in_ef: 'atmo_random.out_source_ngs_ef'
  outputs: ['out_modes']

scale_random:
  class:  'BaseOperation'
  constant_mul_data: 'corr_vec_20260609_192600' 
  inputs:
    in_value1: 'modal_analysis_random.out_modes'
  outputs: ['out_value']

# DM applying partial correction
dm_random:
  class: 'DM'
  simul_params_ref:  'main'
  ifunc_object:      'asm_v30dx_ifunc_shift'      # Our computed influence functions
  m2c_object:        'asm_v30dx_m2c'        # Modal-to-command matrix
  height:            0.0                # Ground-conjugated DM
  inputs:
    in_command:  'scale_random.out_value' # 'modal_analysis_random.out_modes' #
  outputs: ['out_layer']

atmo_pc:
  class: 'ElectricFieldCombinator'
  inputs:
    in_ef1: 'atmo_random.out_source_ngs_ef'    # Turbulence
    in_ef2: 'dm_random.out_layer'              # Partial correction
  outputs: ['out_ef']

ef_mode:
  class: 'ElectricFieldCombinator'
  inputs:
    in_ef1: 'atmo_pc.out_ef'    # Partially corrected turbulence
    in_ef2: 'dm.out_layer'      # Mode amplitudes
  outputs: ['out_ef']

######################################################################################
pyr:
  class:             'ModulatedPyramid'
  simul_params_ref:  'main'
  pup_diam:          40.                     # Pupil diameter in subaps.
  pup_dist:          48.                     # Separation between pupil centers in subaps.
  fov:               2.0                     # Requested field-of-view [arcsec]
  mod_amp:           0.0                     # Modulation radius (in lambda/D units)
  output_resolution: 120                      # Output sampling [usually corresponding to CCD pixels]
  wavelengthInNm:    750                     # [nm] Pyramid wavelength
  inputs:
    in_ef: 'ef_mode.out_ef'

ocam:
  class:             'CCD'
  simul_params_ref:  'main'
  size:              [120,120]            # Total detector size
  dt:                0.001            # [s] Integration time (1000 fps)
  bandw:             300                   # [nm]
  photon_noise:      false                  # Enable photon noise
  readout_noise:     false                  # Enable read noise
  excess_noise:      false                  # Enable excess noise
  readout_level:     0.4                   # [e-/pix/frame] Read noise level
  emccd_gain:        600                   # EMCCD gain factor
  quantum_eff:       0.32                   # QE x transmission
  inputs:
    in_i:            'pyr.out_i' 
  outputs:           ['out_pixels']

pyr_slopes:
  class:                  'PyrSlopec'
  pupdata_object:         'lbt_pupdata'     
  inputs:
    in_pixels:        'ocam.out_pixels'
  outputs:           ['out_slopes']

dm:
  class:             'DM'
  simul_params_ref:  'main'
  ifunc_object:      'asm_v30dx_ifunc_shift'      # Our computed influence functions
  m2c_object:        'asm_v30dx_m2c'        # Modal-to-command matrix
  height:            0                # Ground-conjugated DM
  sign:              1
  nmodes:            600
  inputs:
    in_command:      'pushpull.output'
  outputs:           ['out_layer']

