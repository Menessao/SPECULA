# Synthetic interaction matrix in partial correction
# ================================================

# Push-pull command generator
pushpull:
  class:        'PushPullGenerator'
  nmodes:       1                         # Number of DM actuators
  amp:          0  
  ncycles:      2000
  repeat_full_sequence: true
  outputs:   ['output']

# Interaction matrix calibrator
pyr_im_calibrator:
  class:     'ImCalibrator'
  nmodes:    1                         # Number of modes to calibrate
  im_tag:    'pyr3.0_030749_resOPD'            # Output IM filename
  overwrite: true                         # Overwrite existing files
  inputs:
    in_slopes:   'pyr_slopes.out_slopes'      # WFS slopes input
    in_commands: 'pushpull.output'        # Push-pull commands

# Override main simulation parameters
main_override:
  total_time: 2.352                # 10 modes × 2 (push+pull) × 0.000588s x 40 cycles

atmo_res:
  class: 'PhaseScreenCube'
  simul_params_ref: 'main'
  cube_object:     '20230507_030749_res_OPD'
  pixel_scale:       0.042639
  source_dict_ref:   ['source_ngs']
  inputs:
    pupilstop: 'pupilstop'
  outputs: ['out_source_ngs_layer','out_source_ngs_ef']

atmo_pc:
  class: 'ElectricFieldCombinator'
  inputs:
    in_ef1: 'atmo_res.out_source_ngs_ef'    # Turbulence
    in_ef2: 'dm.out_layer'              # Partial correction
  outputs: ['out_ef']

# atmo_pc:
#   class:             'AtmoPropagation'
#   simul_params_ref:  'main'
#   source_dict_ref:   ['source_ngs'] 
#   inputs:
#     common_layer_list: ['pupilstop','dm.out_layer']       # Pupil
#   outputs:           ['out_source_ngs_ef'] 


# Override DM to use calibration commands
dm_override:
  sign: 1                                 # Use positive sign for calibration (default is -1)
  nmodes: 1                            # Use all modes for calibration
  inputs:
    in_command: 'pushpull.output'         # Connect to push-pull generator 'dm_pc_command.out_value' #

pyr_override:
  inputs: 
    in_ef: 'atmo_pc.out_ef'

