
# Main simulation parameters
main:
  class:             'SimulParams'
  root_dir:          '/raid1/mmenessini/calibration/SOUL/KLv30dx'       # CalibManager root directory (all the data are in subdirectories)
  pixel_pupil:       197                   # Must match influence function computation
  pixel_pitch:       0.0417            # [m] Pitch of the pupil phase array
  total_time:        4.0               # [s] Total simulation running time
  time_step:         0.001               # [s] Simulation time step
  zenithAngleInDeg:  0.0                   # [deg] Zenith observation (0 means no airmass)
  display_server:    false                 # Disable for batch runs

# Atmospheric conditions
seeing:
  class:             'WaveGenerator'
  constant:          1.0                  # [arcsec]

wind_speed:
  class:             'WaveGenerator'
  constant:          [15.0]    # [m/s] Multi-layer wind speeds

wind_direction:
  class:             'WaveGenerator'
  constant:          [38.0] # [deg] Wind directions for each layer

# Natural guide star for WFS
source_ngs:
  class:             'Source'
  polar_coordinates: [0.0, 0.0]            # [arcsec, deg] On-axis NGS
  height:            .inf                  # Infinite height (star)
  magnitude:         8.0                   # R-band magnitude (bright NGS)
  wavelengthInNm:    750                   # [nm] R-band for WFS

# Telescope pupil geometry
pupilstop:
  class:             'Pupilstop'
  tag:               'asm_v30dx_197pixels'


# Multi-layer atmospheric model
atmo:
  class:             'AtmoEvolution'
  simul_params_ref:  'main'
  L0:                25.0                   # [m] Outer scale
  heights:           [0.0] # [m] Ground, mid, high layers at 0 zenith angle
  Cn2:               [1.0]        # Cn2 fractions (sum = 1.0)
  fov:               0.0                    # [arcsec] Field of view
  inputs:
    seeing:          'seeing.output'
    wind_speed:      'wind_speed.output'
    wind_direction:  'wind_direction.output'
  outputs:           ['layer_list']


atmo_prop:
  class:             'AtmoPropagation'
  simul_params_ref:  'main'
  source_dict_ref:   ['source_ngs'] 
  inputs:
    atmo_layer_list: ['atmo.layer_list']
    common_layer_list: ['pupilstop']       # Pupil
  outputs:           ['out_source_ngs_ef'] 

prop:
  class:             'AtmoPropagation'
  simul_params_ref:  'main'
  source_dict_ref:   ['source_ngs'] 
  inputs:
    common_layer_list: ['pupilstop']       # Pupil
  outputs:           ['out_source_ngs_ef'] 

atmo_modes:
  class: 'ModalAnalysis'
  ifunc_inv_object: 'asm_v30dx_kl_inv'
  nmodes: 649
  inputs:
    in_ef: 'atmo_prop.out_source_ngs_ef'
  outputs: ['out_modes']

# Data store for results
data_store:
  class:             'DataStore'
  store_dir:         '/raid1/mmenessini/results/SOUL/KLv30dx/atmo'             # Data result directory: 'store_dir'/TN/
  create_tn:          false
  inputs:
    input_list: ['atmo_649modes_s10_V15_f1000-atmo_modes.out_modes']

# remove: ['']
