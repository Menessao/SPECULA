############################ Control ################################
bootstrap1:
  class:              'ScheduleGenerator'
  scheduled_values:   [[0.1],[0.3],[0.75]] # Nrows x Ncols, times x gains
  modes_per_group:    [1300] # Ncols
  scheduled_times:    [0.01,0.05] # Nrows-1

filter1:
  # class:             'Integrator'
  # simul_params_ref:  'main'
  # delay:             1                     # 1 frame delay (realistic)
  # int_gain:          [0.4]
  # n_modes:           [1300]                 # Number of modes to control
  # inputs:
  #   delta_comm:      'pyr_modalrec.out_modes' #
  # outputs:           ['out_comm']
  class:                'IirFilter'
  simul_params_ref:     'main'
  delay:                1 # Total temporal delay in time steps is this value +1
  iir_filter_data_object:  'cascading_iirfilter_1300modes' #'iirfilter_1300modes_exc1_pow1.5' #
  inputs:
    delta_comm: 'pyr_modalrec.out_modes' #'ogc_modes.out_value' 
    gain_mod: 'bootstrap1.output'
  outputs:  ['out_comm']

dm1:
  class:             'DM'
  simul_params_ref:  'main'
  ifunc_object:      'bmc2k_vlt_ifunc'      # Our computed influence functions
  m2c_object:        'bmc2k_vlt_m2c'        # Modal-to-command matrix
  nmodes:            1300             # Number of controlled modes
  height:            0                # Ground-conjugated DM
  inputs:
    in_command:      'filter1.out_comm'
  outputs:           ['out_layer']


