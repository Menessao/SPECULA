# Slope null calibrator - averages WFS response over atmospheric realizations
pyr_sn:
  class: 'SnCalibrator'
  output_tag: 'pyr0.0_24x24_pc500modes_sn'           # Output filename
  overwrite: true
  inputs:
    in_slopes: 'pyr0_slopes.out_slopes'

# Random seeing generator - varies around nominal value (here 1.0 arcsec)
seeing_random:
  class:             'RandomGenerator'
  amp:               0.05                 # Variation amplitude [arcsec]
  constant:          1.0                 # Mean seeing [arcsec]
  distribution:      'UNIFORM'           # Uniform distribution in [0.9, 1.1]
  outputs: ['output']

# Random atmospheric phase generator
atmo_random:
  class:                'AtmoRandomPhase'
  simul_params_ref:  'main'
  L0:                   25               # [m] Outer scale
  source_dict_ref:      ['source_ngs']
  inputs:
    seeing: 'seeing_random.output'
    pupilstop: 'pupilstop'
  outputs: ['out_source_ngs_ef']

# Modal decomposition of atmospheric phase
modal_analysis_random:
  class: 'ModalAnalysis'
  ifunc_inv_object: 'bmc2k_vlt_kl_inv'
  inputs:
    in_ef: 'atmo_random.out_source_ngs_ef'
  outputs: ['out_modes']

# scale_random:
#   class:  'BaseOperation'
#   # constant_mul: 0.95                    # correction level
#   constant_mul_data: 'correction_vector_1300modes'  # From file
#   inputs:
#     in_value1: 'modal_analysis_random.out_modes'
#   outputs: ['out_value']

# DM applying partial correction
dm_random:
  class: 'DM'
  simul_params_ref: 'main'
  ifunc_object:      'bmc2k_vlt_ifunc'      # Our computed influence functions
  m2c_object:        'bmc2k_vlt_m2c'        # Modal-to-command matrix
  nmodes:            500             # Number of controlled modes
  height:            0                # Ground-conjugated DM
  inputs:
    in_command: 'modal_analysis_random.out_modes' #'scale_random.out_value'
  outputs: ['out_layer']

# Combine atmospheric turbulence with DM correction
second_stage_prop_override:
  inputs:
    in_ef1: 'atmo_random.out_source_ngs_ef'    # Turbulence
    in_ef2: 'dm_random.out_layer'                  # Partial correction

# Override main parameters for sufficient statistical sampling
main_override:
  total_time: 1.000                    # 1000 frames at 1kHz

# Override Pyramid input to use combined field
pyr0_override:
  mod_amp: 0.0
  pup_diam: 24.0
  pup_dist: 30.0
  inputs:
    in_ef: 'second_stage_prop.out_ef' 
  
# cred2_override:
#   photon_noise:   false                   # No photon noise
#   readout_noise:  false                   # No read noise
#   excess_noise:   false                   # No excess noise

data_store_override:
  store_dir:         '/raid1/mmenessini/calibration/XAO/frames'            # Data result directory: 'store_dir'/TN/
  create_tn:           false
  inputs:
    input_list: ['pyr0.0_24x24_pc500modes_frames-cred2.out_pixels',]

# Remove closed-loop components (not needed for slope null)
remove: ['atmo','seeing','wind_speed','wind_direction', #'bootstrap', 'concat_wfs_modes', #'source_science',
        'dm1','dm1_mode_res','filter1','psf2','prop','pyr_modalrec','coro_psf1', 
        'dm2','dm2_mode_res','filter2','coro_psf2', 'atmo_modes', 'cmd1_to_cmd2', 'pyr0_modalrec',
        'pyr','pyr_slopes','dcao_cmd2','first_stage_prop','cred1']