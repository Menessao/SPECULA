# Interaction Matrix and Reconstructor Calibration
# ================================================

# Push-pull command generator
pushpull:
  class:        'PushPullGenerator'
  nmodes:       463                         # Number of DM actuators
  amp:          10   # was 5!
  # constant_amp: true
  outputs:   ['output']

# Interaction matrix calibrator
pyr_im_calibrator:
  class:     'ImCalibrator'
  nmodes:    463                         # Number of modes to calibrate
  im_tag:    'pyr0.0_16x16_463modes_im'            # Output IM filename
  overwrite: false                         # Overwrite existing files
  inputs:
    in_slopes:   'pyr0_slopes.out_slopes'      # WFS slopes input
    in_commands: 'pushpull.output'        # Push-pull commands

# zwfs_im_calibrator:
#   class:     'ImCalibrator'
#   nmodes:    463                         # Number of modes to calibrate
#   im_tag:    'z1.5wfs_463modes_12x12_im'            # Output IM filename
#   overwrite: false                         # Overwrite existing files
#   inputs:
#     in_slopes:   'zwfs_slopes.out_slopes'      # WFS slopes input
#     in_commands: 'pushpull.output'        # Push-pull commands

# Override main simulation parameters
main_override:
  time_step: 0.00025
  total_time: 0.2315                 # 463 modes × 2 (push+pull) × 0.00025s

# Disable atmosphere for clean calibration
prop_override:
  source_dict_ref:   ['source_ngs']
  inputs:
    common_layer_list: ['pupilstop', 'dm1.out_layer']  # Only pupil + DM
  outputs:           ['out_source_ngs_ef']

# Override DM to use calibration commands
dm1_override:
  sign: 1                                 # Use positive sign for calibration (default is -1)
  ifunc_object:      'dm468_vlt_ifunc' 
  m2c_object:        'dm468_vlt_m2c' 
  nmodes: 463                            # Use all modes for calibration
  inputs:
    in_command: 'pushpull.output'         # Connect to push-pull generator

pyr0_override:
  inputs: 
    in_ef: 'prop.out_source_ngs_ef'

# zwfs_override:
#   fft_res: 16.0
#   spot_radius_lambda: 0.750                     # Spot RADIUS in λ/D units
#   inputs: 
#     in_ef: 'prop.out_source_ngs_ef'

# # Disable noise for clean measurements
# cred1_override:
#   dt: 0.00025
#   photon_noise:   false                   # No photon noise
#   readout_noise:  false                   # No read noise
#   excess_noise:   false                   # No excess noise

cred2_override:
  dt: 0.00025
  photon_noise:   false                   # No photon noise
  readout_noise:  false                   # No read noise
  excess_noise:   false                   # No excess noise


# Remove unnecessary objects during calibration
remove: ['atmo','seeing','wind_speed','wind_direction','data_store','atmo_modes', #'source_science',
        'dm1_mode_res','filter1','psf2', 'coro_psf1','pyr_modalrec','bootstrap1','bootstrap',
        'filter2','first_stage_prop','second_stage_prop','dm2_mode_res','dm2','coro_psf2',
        'pyr','cmd1_to_cmd2','cred1','dcao_cmd2','pyr_slopes'] #, 'bootstrap', 'concat_wfs_modes'
