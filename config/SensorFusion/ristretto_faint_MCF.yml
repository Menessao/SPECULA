
# Main simulation parameters
main:
  class:             'SimulParams'
  root_dir:          '/raid1/mmenessini/calibration/XAO'       # CalibManager root directory (all the data are in subdirectories)
  pixel_pupil:       160                   # Must match influence function computation
  pixel_pitch:       0.0513                # [m] 8.2m / 160 pixels = 0.0513 m/pixel (Nyquist sampling of 10cm r0)
  total_time:        4.000                 # [s] 1 second simulation
  time_step:         0.00025                # [s] 0.5ms time steps (2 kHz)
  zenithAngleInDeg:  0.0                   # [deg] Zenith observation (0 means no airmass)
  display_server:    false                 # Disable for batch runs

# Atmospheric conditions
seeing:
  class:             'WaveGenerator'
  constant:          0.88                  # [arcsec]
  outputs:           ['output']

wind_speed:
  class:             'WaveGenerator'
  constant:          [6.6, 5.9, 5.1, 4.5, 5.1, 8.3, 16.3, 30.2, 34.3, 17.5]    # [m/s] Multi-layer wind speeds
  outputs:           ['output']

wind_direction:
  class:             'WaveGenerator'
  constant:          [38.0, 34.0, 54.0, 42.0, 68.0, 48.0, -102.0, -83.0, -77.0, 34.0] # [deg] Wind directions for each layer
  outputs:           ['output']

# Natural guide star for WFS
source_ngs:
  class:             'Source'
  polar_coordinates: [0.0, 0.0]            # [arcsec, deg] On-axis NGS
  height:            .inf                  # Infinite height (star)
  magnitude:         10.0                   # R-band magnitude (bright NGS)
  wavelengthInNm:    750                   # [nm] R-band for WFS

# Telescope pupil geometry
pupilstop:
  class:             'Pupilstop'
  tag:               'vlt_pupil_160pixels'

# Multi-layer atmospheric model
atmo:
  class:             'AtmoEvolution'
  simul_params_ref:  'main'
  L0:                25.0                   # [m] Outer scale
  heights:           [110, 238, 402, 728, 1381, 2686, 5296, 9066, 12836, 16136] # [m] Ground, mid, high layers at 0 zenith angle
  Cn2:               [0.59, 0.02, 0.04, 0.06, 0.01, 0.05, 0.09, 0.04, 0.05, 0.05]        # Cn2 fractions (sum = 1.0)
  fov:               0.0                    # [arcsec] Field of view
  inputs:
    seeing:          'seeing.output'
    wind_speed:      'wind_speed.output'
    wind_direction:  'wind_direction.output'
  outputs:           ['layer_list']

# Atmospheric propagation
prop:
  class:             'AtmoPropagation'
  simul_params_ref:  'main'
  source_dict_ref:   ['source_ngs'] 
  inputs:
    atmo_layer_list: ['atmo.layer_list']
    common_layer_list: ['pupilstop']       # Pupil
  outputs:           ['out_source_ngs_ef'] 

ef_prop:
  class: 'ElectricFieldCombinator'
  inputs:
    in_ef1: 'prop.out_source_ngs_ef'    # Turbulence
    in_ef2: 'dm.out_layer:-1'          # DM1 correction
  outputs: ['out_ef']


########################### 1st stage ##############################
pyr:
  class:             'ModulatedPyramid'
  simul_params_ref:  'main'
  pup_diam:          48.                     # Pupil diameter in subaps.
  pup_dist:          60.                     # Separation between pupil centers in subaps.
  fov:               2.0                     # Requested field-of-view [arcsec]
  mod_amp:           3.0                     # Modulation radius (in lambda/D units)
  output_resolution: 120                      # Output sampling [usually corresponding to CCD pixels]
  wavelengthInNm:    1200                     # [nm] Pyramid wavelength
  inputs:
    in_ef: 'ef_prop.out_ef' 

cred1:
  class:             'CCD'
  simul_params_ref:  'main'
  size:              [120,120]            # Total detector size
  dt:                0.001                # [s] Integration time (3000 fps)
  bandw:             400                   # [nm]
  photon_noise:      true                  # Enable photon noise
  readout_noise:     true                  # Enable read noise
  excess_noise:      true                  # Enable excess noise
  readout_level:     0.5                   # [e-/pix/frame] Read noise level
  emccd_gain:        400                   # EMCCD gain factor
  quantum_eff:       0.2                   # QE x transmission
  inputs:
    in_i:            'pyr.out_i' 
  outputs:           ['out_pixels']

pyr_slopes:
  class:                  'PyrSlopec'
  pupdata_object:         'pyr_pupdata_48x48'           
  slopes_from_intensity:  true
  sn_object:            'pyr3.0_48x48_sn' 
  inputs:
    in_pixels:        'cred1.out_pixels'
  outputs:           ['out_slopes']

pyr_modalrec:
  class:             'Modalrec'
  recmat_object:     'pyr3.0_48x48_1300modes_rec'        
  inputs:
    in_slopes:       'pyr_slopes.out_slopes'
  outputs:           ['out_modes']

# ######################### 2nd stage ##############################
pyr0:
  class:             'ModulatedPyramid'
  simul_params_ref:  'main'
  pup_diam:          16.                     # Pupil diameter in subaps.
  pup_dist:          20.                     # Separation between pupil centers in subaps.
  fov:               2.0                     # Requested field-of-view [arcsec]
  mod_amp:           0.0                     # Modulation radius (in lambda/D units)
  output_resolution: 120                      # Output sampling [usually corresponding to CCD pixels]
  wavelengthInNm:    900                     # [nm] Pyramid wavelength
  inputs:
    in_ef: 'ef_prop.out_ef' 

cred2:
  class:             'CCD'
  simul_params_ref:  'main'
  size:              [120,120]            # Total detector size
  dt:                0.00025               # [s] Integration time (4000 fps)
  bandw:             150                   # [nm]
  photon_noise:      true                  # Enable photon noise
  readout_noise:     true                  # Enable read noise
  excess_noise:      true                  # Enable excess noise
  readout_level:     0.4                   # [e-/pix/frame] Read noise level
  emccd_gain:        400                   # EMCCD gain factor
  quantum_eff:       0.2                   # QE x transmission
  inputs:
    in_i:            'pyr0.out_i' 
  outputs:           ['out_pixels']

pyr0_slopes:
  class:                  'PyrSlopec'
  pupdata_object:         'pyr_pupdata_16x16'           
  slopes_from_intensity:  true
  sn_object:            'pyr0.0_16x16_sn' #'pyr0.0_16x16_pc1300modes_sn' #
  inputs:
    in_pixels:        'cred2.out_pixels'
  outputs:           ['out_slopes']

pyr0_modalrec:
  class:             'Modalrec'
  recmat_object:     'pyr0.0_16x16_150modes_rec'        
  inputs:
    in_slopes:       'pyr0_slopes.out_slopes'
  outputs:           ['out_modes']

############################ Control ################################
lo_mod_pyr_modes:
  class: 'BaseSlicer'
  slice_args: [0,150]
  inputs:
    in_value: 'pyr_modalrec.out_modes'
  outputs: ['out_value']

lo_filter:
  class:                    'MultirateComplementaryFilter'
  simul_params_ref:         'main'
  delay:                    1             # Total temporal delay in time steps is this value +1
  iir_filter_data_object:  'iirfilter_150modes_exc2_pow1.0'  #'iir_opt_1300modes' #
  weights:                  [0.5,0.5]     # weigths for fast and slow measurements
  N_list:                   [4]           # ffast/slow frequency ratio (list)
  g_track:                  0.7           # gain
  inputs:
    in_ys: 'lo_mod_pyr_modes.out_value'
    in_yf: 'pyr0_modalrec.out_modes'
    gain_mod:  'gain_ramp_lo.output'
  outputs:  ['out_comm']

gain_ramp_lo:
  class:             'ScheduleGenerator'
  scheduled_values: [[0.1],[0.2]]
  scheduled_times: [0.001]
  modes_per_group: [150]

gain_ramp_ho:
  class:             'ScheduleGenerator'
  scheduled_values: [[0.1],[0.2]]
  scheduled_times: [0.001]
  modes_per_group: [1300]

ho_filter:
  class:                'IirFilter'
  simul_params_ref:     'main'
  delay:                1 # Total temporal delay in time steps is this value +1
  iir_filter_data_object:  'iirfilter_1300modes'
  inputs:
    delta_comm: 'pyr_modalrec.out_modes'
    gain_mod: 'gain_ramp_ho.output'
  outputs:  ['out_comm']

ho_comm:
  class: 'BaseSlicer'
  slice_args: [151,1300]
  inputs:
    in_value: 'ho_filter.out_comm'
  outputs: ['out_value']

concat_comms:
  class:      'BaseOperation'
  concat: true
  inputs:
    in_value1:  'lo_filter.out_comm'
    in_value2:  'ho_comm.out_value'
  outputs: ['out_value']

dm:
  class:             'DM'
  simul_params_ref:  'main'
  ifunc_object:      'bmc2k_vlt_ifunc'      # Our computed influence functions
  m2c_object:        'bmc2k_vlt_m2c'        # Modal-to-command matrix
  nmodes:            1300             # Number of controlled modes
  height:            0                # Ground-conjugated DM
  inputs:
    in_command:       'concat_comms.out_value' #'ho_filter.out_comm' #
  outputs:           ['out_layer']


###########################################################
##################### POST-PROCESSING #####################
# Coronagraphic and non-coronagraphic PSFs
coro_psf:
  class:             'PsfCoronagraph'
  simul_params_ref:  'main'
  wavelengthInNm:    750                 # [nm] visible
  nd:                4                   # 4x padding for PSF
  start_time:        0.5                 # Start PSF integration after 500ms
  verbose: true
  # use_average_field: false
  compute_profile_metrics: true
  inputs:
    in_ef:           'ef_prop.out_ef' 


dm_mode_res:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'bmc2k_vlt_kl_inv'
  inputs:
    in_ef: ['ef_prop.out_ef']
  outputs: ['out_modes']

atmo_modes:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'bmc2k_vlt_kl_inv'
  inputs:
    in_ef: ['prop.out_source_ngs_ef']
  outputs: ['out_modes']

# Data store for results
data_store:
  class:             'DataStore'
  store_dir:         '/raid1/mmenessini/results/Cascading'            # Data result directory: 'store_dir'/TN/
  inputs:
    input_list: [
                  # 'atmo_phase-first_stage_prop.out_ef',
                  # 'dm1_cmd-filter1.out_comm',
                  'sr-coro_psf.out_sr',
                  'coro_psf-coro_psf.out_std_coronagraph_psf_profile',
                  'atmo_res-atmo_modes.out_modes',
                  'dm_res-dm_mode_res.out_modes',
                  ]

# remove: ['']
