filter:
  class:                'IirFilter'
  simul_params_ref:     'main'
  delay:                1 # Total temporal delay in time steps is this value +1
  iir_filter_data_object:  'iirfilter_1300modes'
  inputs:
    delta_comm: 'pyr_modalrec.out_modes' #'concat_wfs_modes.out_value' 
    gain_mod: 'gain_ramp.output'
  outputs:  ['out_comm']


gain_ramp:
  class:             'ScheduleGenerator'
  scheduled_values: [[0.1],[0.2]]
  scheduled_times: [0.01]
  modes_per_group: [1300]

dm:
  class:             'DM'
  simul_params_ref:  'main'
  ifunc_object:      'bmc2k_vlt_ifunc'      # Our computed influence functions
  m2c_object:        'bmc2k_vlt_m2c'        # Modal-to-command matrix
  nmodes:            1300             # Number of controlled modes
  height:            0                # Ground-conjugated DM
  inputs:
    in_command:      'filter.out_comm'
  outputs:           ['out_layer']

dm_perfect:
  class:             'DM'
  simul_params_ref:  'main'
  ifunc_object:      'bmc2k_vlt_ifunc'      # Our computed influence functions
  m2c_object:        'bmc2k_vlt_m2c'        # Modal-to-command matrix
  nmodes:            1300             # Number of controlled modes
  height:            0                # Ground-conjugated DM
  inputs:
    in_command:      'atmo_modes.out_modes'
  outputs:           ['out_layer']

###########################################################
##################### POST-PROCESSING #####################
# Coronagraphic and non-coronagraphic PSFs
psf:
  class:             'PSF'
  simul_params_ref:  'main'
  wavelengthInNm:    750                 # [nm] visible
  nd:                4                    # 4x padding for PSF
  start_time:        1.0                  # Start PSF integration after 500ms
  verbose: true
  compute_profile_metrics: true
  inputs:
    in_ef:           'ef_prop.out_ef'
  outputs:           ['out_psf', 'out_std_psf', 'out_sr']

coro_psf:
  class:             'PsfCoronagraph'
  simul_params_ref:  'main'
  wavelengthInNm:    750                 # [nm] visible
  nd:                4                    # 4x padding for PSF
  start_time:        1.0                  # Start PSF integration after 500ms
  # verbose: true
  use_average_field: false
  compute_profile_metrics: true
  inputs:
    in_ef:           'ef_prop.out_ef' 
  outputs:           ['out_coronagraph_psf','out_std_coronagraph_psf_profile'] # 'out_std_coronagraph_psf','out_int_coronagraph_psf_profile',

coro_opt_psf:
  class:             'PsfCoronagraph'
  simul_params_ref:  'main'
  wavelengthInNm:    750                 # [nm] visible
  nd:                4                    # 4x padding for PSF
  start_time:        1.0                  # Start PSF integration after 500ms
  # verbose: true
  use_average_field: false
  compute_profile_metrics: true
  inputs:
    in_ef:           'perfect_corr.out_ef' 
  outputs:           ['out_coronagraph_psf','out_std_coronagraph_psf_profile'] 

dm_mode_res:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'bmc2k_vlt_kl_inv'
  inputs:
    in_ef: ['ef_prop.out_ef']
  outputs: ['out_modes']

atmo_modes:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'bmc2k_vlt_kl_inv'
  inputs:
    in_ef: ['prop.out_source_ngs_ef']
  outputs: ['out_modes']

# Data store for results
data_store:
  class:             'DataStore'
  store_dir:         '/raid1/mmenessini/results/XAO'            # Data result directory: 'store_dir'/TN/
  inputs:
    input_list: [
                  # 'test_fresnel_ef-prop.out_source_ngs_ef',
                  'sr-psf.out_sr',
                  'psf-psf.out_psf',
                  # 'psf_std-psf.out_std_psf',
                  'coro_psf-coro_psf.out_coronagraph_psf',
                  'opt_psf-coro_opt_psf.out_psf',
                  # 'coro_psf_std-coro_psf.out_std_coronagraph_psf',
                  'psf_profile-coro_psf.out_int_psf_profile',
                  'coro_psf_profile-coro_psf.out_std_coronagraph_psf_profile',
                  'coro_opt_psf_profile-coro_opt_psf.out_std_coronagraph_psf_profile',
                  'atmo_res-atmo_modes.out_modes',
                  'dm_res-dm_mode_res.out_modes',
                  'dm_cmd-filter.out_comm',
                  'pyr_modes-pyr0_modalrec.out_modes',
                  # 'zwfs_modes-zwfs_modalrec.out_modes',
                  # 'ccd1-cred1.out_pixels',
                  # 'ccd2-ocam2.out_pixels'
                  ]

