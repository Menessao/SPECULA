
# Main simulation parameters
main:
  class:             'SimulParams'
  root_dir:          '/raid1/mmenessini/calibration/ekarus/'       # CalibManager root directory (all the data are in subdirectories)
  pixel_pupil:       120                   # Must match influence function computation
  pixel_pitch:       0.015167              # [m] Pitch of the pupil phase array (1.82m/120pix)
  total_time:        2.0                   # [s] Total simulation running time
  time_step:         0.001                 # [s] Simulation time step
  zenithAngleInDeg:  0.0                   # [deg] Zenith observation (0 means no airmass)
  display_server:    false                 # Disable for batch runs

# Atmospheric conditions
seeing:
  class:             'WaveGenerator'
  constant:          1.5                  # [arcsec]

wind_speed:
  class:             'WaveGenerator'
  constant:          [6.6, 5.9, 5.1, 4.5, 5.1, 8.3, 16.3, 30.2, 34.3, 17.5]    # [m/s] Multi-layer wind speeds
  # constant:          [15.0, 13.0, 13.0, 9.0, 9.0, 15.0, 25.0, 40.0, 21.0]    # [m/s] Multi-layer wind speeds
  # constant:          [2, 4, 6, 25]    # [m/s] Multi-layer wind speeds

wind_direction:
  class:             'WaveGenerator'
  constant:          [38.0, 34.0, 54.0, 42.0, 68.0, 48.0, -102.0, -83.0, -77.0, 34.0] # [deg] Wind directions for each layer
  # constant:          [38.0, 34.0, 54.0, 42.0, 57.0, 48.0, -102.0, -83.0, -77.0] # [deg] Wind directions for each layer
  # constant:          [38, 162, -102, -45] # [deg] Wind directions for each layer

# Natural guide star for WFS
source_ngs:
  class:             'Source'
  polar_coordinates: [0.0, 0.0]            # [arcsec, deg] On-axis NGS
  height:            .inf                  # Infinite height (star)
  magnitude:         0.0                   # R-band magnitude (bright NGS)
  wavelengthInNm:    750                   # [nm] R-band for WFS

# Telescope pupil geometry
pupilstop:
  class:             'Pupilstop'
  tag:               'Copernico_pupil_120pixels'

# Multi-layer atmospheric model
atmo:
  class:             'AtmoEvolution'
  simul_params_ref:  'main'
  L0:                25.0                   # [m] Outer scale
  heights:           [110, 238, 402, 728, 1381, 2686, 5296, 9066, 12836, 16136] # [m] Ground, mid, high layers at 0 zenith angle
  Cn2:               [0.59, 0.02, 0.04, 0.06, 0.01, 0.05, 0.09, 0.04, 0.05, 0.05]        # Cn2 fractions (sum = 1.0)
  # heights:           [103, 725, 2637, 11068] # [m] Ground, mid, high layers at 0 zenith angle
  # Cn2:               [0.70, 0.06, 0.14, 0.10]        # Cn2 fractions (sum = 1.0)
  fov:               0.0                    # [arcsec] Field of view
  inputs:
    seeing:          'seeing.output'
    wind_speed:      'wind_speed.output'
    wind_direction:  'wind_direction.output'
  outputs:           ['layer_list']

# Atmospheric propagation
prop:
  class:             'AtmoPropagation'
  simul_params_ref:  'main'
  source_dict_ref:   ['source_ngs'] 
  inputs:
    atmo_layer_list: ['atmo.layer_list']
    common_layer_list: ['pupilstop', 'dm.out_layer:-1']       # Pupil
  outputs:           ['out_source_ngs_ef'] 


########################### PWFS ##############################
pyr:
  class:             'ModulatedPyramid'
  simul_params_ref:  'main'
  pup_diam:          40.                     # Pupil diameter in subaps.
  pup_dist:          60.                     # Separation between pupil centers in subaps.
  fov:               8.8                     # Requested field-of-view [arcsec]
  mod_amp:           5.0                     # Modulation radius (in lambda/D units)
  output_resolution: 120                      # Output sampling [usually corresponding to CCD pixels]
  wavelengthInNm:    750                     # [nm] Pyramid wavelength
  inputs:
    in_ef: 'prop.out_source_ngs_ef'

ocam:
  class:             'CCD'
  simul_params_ref:  'main'
  size:              [120,120]            # Total detector size
  dt:                0.001              # [s] Integration time (2000 fps)
  bandw:             300                   # [nm]
  photon_noise:      true                  # Enable photon noise
  readout_noise:     true                  # Enable read noise
  excess_noise:      false                  # Enable excess noise
  readout_level:     0.4                   # [e-/pix/frame] Read noise level
  emccd_gain:        1                   # EMCCD gain factor
  quantum_eff:       0.1                   # QE x transmission
  inputs:
    in_i:            'pyr.out_i' 
  outputs:           ['out_pixels']

pyr_slopes:
  class:                  'PyrSlopec'
  pupdata_object:         'pyr_pupdata_40x40'           
  slopes_from_intensity:  true
  clamp_negative:         false             # keep negative (noisy) pixels: linear noise
  inputs:
    in_pixels:        'ocam.out_pixels'
  outputs:           ['out_slopes']

pyr_modalrec:
  class:             'Modalrec'
  recmat_object:     'pyr5.0_dm468_40x40_400modes'        
  inputs:
    in_slopes:       'pyr_slopes.out_slopes'
  outputs:           ['out_modes']

filter: 
  class:             'Integrator'
  delay:             1.0                     # Temporal delay in time steps
  int_gain:          [0.4] #[0.7,0.6,0.2] #
  # ff:                [1.0,0.99,0.95]
  n_modes:           [400] #[2,120,278] #
  inputs:
      delta_comm:  'pyr_modalrec.out_modes' #'scaled_modes.out_value' #

dm:
  class:             'DM'
  simul_params_ref:  'main'
  ifunc_object:      'dm468_120pix_ifunc' #'DM468_ifunc'   #'DM468_ifunc' #    # Influence functions
  m2c_object:        'dm468_120pix_m2c' #'M2C_KL_OOPAO_synthetic'  #'DM468_m2c'     #'DM468_m2c' #   # Modal-to-command matrix
  height:            0                # Ground-conjugated DM
  nmodes:            450
  inputs:
    in_command:      'filter.out_comm'
  outputs:           ['out_layer']

###########################################################
##################### POST-PROCESSING #####################
# Coronagraphic and non-coronagraphic PSFs
psf:
  class:             'PSF'
  simul_params_ref:  'main'
  wavelengthInNm:    650                 # [nm] visible
  nd:                4                    # 4x padding for PSF
  start_time:        1.0                  # Start PSF integration after 500ms
  inputs:
    in_ef:           'prop.out_source_ngs_ef'
  outputs:           ['out_psf', 'out_std_psf', 'out_sr']
 

true_res:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'dm468_120pix_kl_inv'
  inputs:
    in_ef: ['prop.out_source_ngs_ef']
  outputs: ['out_modes']

dm_modes:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'dm468_120pix_kl_inv'
  inputs:
    in_ef: ['dm.out_layer:-1']
  outputs: ['out_modes']

atmo_modes:
  class: 'BaseOperation'
  sum:    true
  inputs:
    in_value1: 'dm_modes.out_modes'
    in_value2: 'true_res.out_modes'
  outputs: ['out_value']

# Data store for results
data_store:
  class:             'DataStore'
  store_dir:         '/raid1/mmenessini/results/ekarus'             # Data result directory: 'store_dir'/TN/
  inputs:
    input_list: [
                  'sr-psf.out_sr',
                  'atmo_modes-atmo_modes.out_value',
                  'ao_res-true_res.out_modes',
                  'dm_modes-dm_modes.out_modes',
                  'dm_cmd-filter.out_comm',
                  'pyr_modes-pyr_modalrec.out_modes',
                  # 'ccd-ocam.out_pixels',
                  ]
