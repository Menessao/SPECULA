
# Main simulation parameters
main:
  class:             'SimulParams'
  root_dir:          '/raid1/mmenessini/calibration/CHAOS/'       # CalibManager root directory (all the data are in subdirectories)
  pixel_pupil:       220                   # Must match influence function computation
  pixel_pitch:       0.03636            # [m] Pitch of the pupil phase array (1.82m/160pix)
  total_time:        2.0                   # [s] Total simulation running time
  time_step:         0.001                 # [s] Simulation time step
  zenithAngleInDeg:  0.0                   # [deg] Zenith observation (0 means no airmass)
  display_server:    false                 # Disable for batch runs

# Atmospheric conditions
seeing:
  class:             'WaveGenerator'
  constant:          1.0                  # [arcsec]

wind_speed:
  class:             'WaveGenerator'
  constant:          [10]    # [m/s] Multi-layer wind speeds

wind_direction:
  class:             'WaveGenerator'
  constant:          [45] # [deg] Wind directions for each layer

# Natural guide star for WFS
source_ngs:
  class:             'Source'
  polar_coordinates: [0.0, 0.0]            # [arcsec, deg] On-axis NGS
  height:            .inf                  # Infinite height (star)
  magnitude:         7.0                   # R-band magnitude (bright NGS)
  wavelengthInNm:    650                   # [nm] R-band for WFS

# Telescope pupil geometry
pupilstop:
  class:             'Pupilstop'
  # tag:               'DM468_160pixels_bestshift'
  tag:               'dm820_220pix_pupil'

# Multi-layer atmospheric model
atmo:
  class:             'AtmoEvolution'
  simul_params_ref:  'main'
  L0:                25.0                   # [m] Outer scale
  heights:           [0] # [m] Ground, mid, high layers at 0 zenith angle
  Cn2:               [1.0]        # Cn2 fractions (sum = 1.0)
  fov:               0.0                    # [arcsec] Field of view
  inputs:
    seeing:          'seeing.output'
    wind_speed:      'wind_speed.output'
    wind_direction:  'wind_direction.output'
  outputs:           ['layer_list']

# Atmospheric propagation
prop:
  class:             'AtmoPropagation'
  simul_params_ref:  'main'
  source_dict_ref:   ['source_ngs'] 
  inputs:
    atmo_layer_list: ['atmo.layer_list']
    common_layer_list: ['pupilstop']       # Pupil
  outputs:           ['out_source_ngs_ef'] 

ef_prop:
  class: 'ElectricFieldCombinator'
  inputs:
    in_ef1: 'prop.out_source_ngs_ef'    # Turbulence
    in_ef2: 'dm.out_layer:-1'          # DM1 correction
  outputs: ['out_ef']


########################### PWFS ##############################
pyr:
  class:             'ModulatedPyramid'
  simul_params_ref:  'main'
  pup_diam:          60.                     # Pupil diameter in subaps.
  pup_dist:          72.                     # Separation between pupil centers in subaps.
  fov:               4.0                     # Requested field-of-view [arcsec]
  mod_amp:           3.0                     # Modulation radius (in lambda/D units)
  pyr_roof_ld:       1.0                     # Pyramid roof length (in lambda/D units)   
  output_resolution: 160                      # Output sampling [usually corresponding to CCD pixels]
  wavelengthInNm:    650                     # [nm] Pyramid wavelength
  inputs:
    in_ef: 'ef_prop.out_ef' #'prop.out_source_ngs_ef'

ocam:
  class:             'CCD'
  simul_params_ref:  'main'
  size:              [160,160]            # Total detector size
  dt:                0.001              # [s] Integration time (2000 fps)
  bandw:             300                   # [nm]
  photon_noise:      true                  # Enable photon noise
  readout_noise:     true                  # Enable read noise
  excess_noise:      false                  # Enable excess noise
  readout_level:     1.0                   # [e-/pix/frame] Read noise level
  emccd_gain:        1                   # EMCCD gain factor
  quantum_eff:       0.2                   # QE x transmission
  inputs:
    in_i:            'pyr.out_i' 
  outputs:           ['out_pixels']

pyr_slopes:
  class:                  'PyrSlopec'
  pupdata_object:         'pyr_pupdata'           
  slopes_from_intensity:  true
  inputs:
    in_pixels:        'ocam.out_pixels'
  outputs:           ['out_slopes']

pyr_modalrec:
  class:             'Modalrec'
  recmat_object:     'pyr3.0_dm820_rec'   #'pyr5.0_40x40_400modes_rec'        
  inputs:
    in_slopes:       'pyr_slopes.out_slopes'
  outputs:           ['out_modes']

filter: 
  class:             'Integrator'
  delay:             1.0                     # Temporal delay in time steps
  int_gain:          [0.5]
  ff:                [0.99]
  n_modes:           [500] #[2,120,278] #
  inputs:
      delta_comm:  'pyr_modalrec.out_modes' #'scaled_modes.out_value' #

dm:
  class:             'DM'
  simul_params_ref:  'main'
  ifunc_object:      'dm820_ifunc' #    # Influence functions
  m2c_object:        'dm820_m2c' #'M2C_KL_OOPAO_synthetic'  #'DM468_m2c'     #'DM468_m2c' #   # Modal-to-command matrix
  height:            0                # Ground-conjugated DM
  nmodes:            500
  inputs:
    in_command:      'filter.out_comm'
  outputs:           ['out_layer']

###########################################################
##################### POST-PROCESSING #####################
# Coronagraphic and non-coronagraphic PSFs
psf:
  class:             'PSF'
  simul_params_ref:  'main'
  wavelengthInNm:    650                 # [nm] visible
  nd:                4                    # 4x padding for PSF
  start_time:        0.0                  # Start PSF integration after 500ms
  verbose: true
  inputs:
    in_ef:           'ef_prop.out_ef'
  outputs:           ['out_psf', 'out_std_psf', 'out_sr']


dm_mode_res:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'dm820_kl_inv'
  inputs:
    in_ef: ['ef_prop.out_ef']
  outputs: ['out_modes']

atmo_modes:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'dm820_kl_inv'
  inputs:
    in_ef: ['prop.out_source_ngs_ef']
  outputs: ['out_modes']

# Data store for results
data_store:
  class:             'DataStore'
  store_dir:         '/raid1/mmenessini/results/CHAOS'             # Data result directory: 'store_dir'/TN/
  inputs:
    input_list: [
                  'sr-psf.out_sr',
                  'atmo_res-atmo_modes.out_modes',
                  'dm_res-dm_mode_res.out_modes',
                  'dm_cmd-filter.out_comm',
                  'pyr_modes-pyr_modalrec.out_modes',
                  'ccd-ocam.out_pixels',
                  ]

# remove: ['']
