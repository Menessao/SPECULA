#       pupil_mask_template: 'pupils/lbt_pupmask_bin2.fits'   # placeholder filename
#       pupdata_template:    'pupils/lbt_pupdata_bin2.fits'   # placeholder filename
#       pupids_template:     'pupils/pup_ids_bin2.fits'       # placeholder filename
#       rec_header_template: null   # e.g. a 'Rec_..._bin2_...fits' template
#     3:
#       ccd_size: null
#       npix: null
#       nslopes: null
#       total_slopes: null
#       pupil_mask_template: 'pupils/lbt_pupmask_bin3.fits'
#       pupdata_template:    'pupils/lbt_pupdata_bin3.fits'
#       pupids_template:     'pupils/pup_ids_bin3.fits'
