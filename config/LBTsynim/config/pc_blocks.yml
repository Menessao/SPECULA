seeing_random:
  class:             'RandomGenerator'
  amp:               0.0                 # Variation amplitude [arcsec]
  constant:          1.0                 # Mean seeing [arcsec] (patched at runtime)
  distribution:      'UNIFORM'
  outputs: ['output']

atmo_random:
  class:                'AtmoRandomPhase'
  simul_params_ref:     'main'
  L0:                   25               # [m] Outer scale
  source_dict_ref:      ['source_ngs']
  update_interval:      1200             # Update after push-pull of all modes
  seed:                 42
  inputs:
    seeing:             'seeing_random.output'
    pupilstop:          'pupilstop'
  outputs:              ['out_source_ngs_ef']

# Modal decomposition of the atmospheric phase, using the *registered*
# inverse-KL for this system/TN (ifunc_inv_object patched at runtime).
modal_analysis_random:
  class: 'ModalAnalysis'
  ifunc_inv_object: 'PLACEHOLDER_IFUNC_INV'   # patched via *_override
  nmodes: 649                                  # patched via *_override
  inputs:
    in_ef: 'atmo_random.out_source_ngs_ef'
  outputs: ['out_modes']

# Optional per-mode attenuation of the analysed modes before commanding
# the DM. Only used when a correction_vector_path is provided.
scale_random:
  class:  'BaseOperation'
  constant_mul_data: ''   # patched via *_override
  inputs:
    in_value1: 'modal_analysis_random.out_modes'
  outputs: ['out_value']

# DM applying the partial correction. `inputs.in_command` is patched at
# runtime to either 'modal_analysis_random.out_modes' (perfect correction,
# default) or 'scale_random.out_value' (attenuated correction).
dm_random:
  class: 'DM'
  simul_params_ref:  'main'
  ifunc_object:      'PLACEHOLDER_IFUNC'   # patched via *_override
  m2c_object:        'PLACEHOLDER_M2C'     # patched via *_override
  height:            0.0
  inputs:
    in_command: 'scale_random.out_value'
  outputs: ['out_layer']

atmo_pc:
  class: 'ElectricFieldCombinator'
  inputs:
    in_ef1: 'atmo_random.out_source_ngs_ef'    # Turbulence
    in_ef2: 'dm_random.out_layer'              # Partial correction
  outputs: ['out_ef']

# Combines the partially-corrected turbulence with the push-pull DM signal
# used to actually calibrate the interaction matrix.
ef_mode:
  class: 'ElectricFieldCombinator'
  inputs:
    in_ef1: 'atmo_pc.out_ef'    # Partially corrected turbulence
    in_ef2: 'dm.out_layer'      # Push-pull mode amplitudes
  outputs: ['out_ef']
