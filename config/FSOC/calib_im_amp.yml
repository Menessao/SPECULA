# Interaction Matrix and Reconstructor Calibration
# ================================================

# Push-pull command generator
pushpull:
  class:        'PushPullGenerator'
  nmodes:       440                        # Number of DM actuators
  amp:          25
  outputs:   ['output']

# Interaction matrix calibrator
pyr_im_calibrator:
  class:     'ImCalibrator'
  nmodes:    440                         # Number of modes to calibrate
  im_tag:    'pyr0.0_40x40_dm468_h10km_im'            # Output IM filename
  overwrite: true                         # Overwrite existing files
  inputs:
    in_slopes:   'pyr_slopes.out_slopes'      # WFS slopes input
    in_commands: 'pushpull.output'        # Push-pull commands

# Override main simulation parameters
main_override:
  time_step: 0.001
  total_time: 0.88                 # 440 modes × 2 (push+pull) × 0.001s

# Disable atmosphere for clean calibration
prop_override:
  source_dict_ref:   ['source_ngs']
  inputs:
    common_layer_list: ['pupilstop', 'dm.out_layer']  # Only pupil + DM
  outputs:           ['out_source_ngs_ef']

ef_prop_override:
  inputs:
    in_ef1: 'prop.out_source_ngs_ef'    # Turbulence
    in_ef2: 'dm_perfect.out_layer'          # DM1 correction
  outputs: ['out_ef']


pyr_slopes_override:
  pupdata_object:         'pyr_pupdata_40x40'  

# Override DM to use calibration commands
dm_override:
  height: 9000
  sign: 1                                 # Use positive sign for calibration (default is -1)
  nmodes: 440                            # Use all modes for calibration
  inputs:
    in_command: 'pushpull.output'         # Connect to push-pull generator
  # ifunc_object:      'obs30_ifunc'      # Influence functions
  # m2c_object:        'obs30_m2c'        # Modal-to-command matrix


dm_perfect:
  class:             'DM'
  simul_params_ref:  'main'
  ifunc_object:      'obs30_ifunc'    # Influence functions
  m2c_object:        'obs30_m2c'      # Modal-to-command matrix
  height:            0                # Ground-conjugated DM
  nmodes:            400
  inputs:
    in_command:      'atmo_modes.out_modes'
  outputs:           ['out_layer']

pyr_override:
  pup_diam:          40.                     # Pupil diameter in subaps.
  pup_dist:          60.    
  mod_amp: 0.0
  inputs: 
    in_ef: 'ef_prop.out_ef'

# pyr_slopes_override:
#   slopes_from_intensity: false

# Disable noise for clean measurements
ocam_override:
  dt: 0.001
  photon_noise:   false                   # No photon noise
  readout_noise:  false                   # No read noise
  excess_noise:   false                   # No excess noise


data_store_override:
  inputs:
    input_list: ['corr_ef-ef_prop.out_ef', 'uncorr_ef-prop.out_source_ngs_ef', 'dm_complex_shape-dm.out_layer']

# Remove unnecessary objects during calibration
remove: ['atmo','seeing','wind_speed','wind_direction', #'data_store',
        'dm_mode_res','filter','psf', 'pyr_modalrec'] 
