
# Main simulation parameters
main:
  class:             'SimulParams'
  root_dir:          '/raid1/mmenessini/calibration/FSOC'  # CalibManager root directory (all the data are in subdirectories); overridden by aoeb
  pixel_pupil:       120                   # Must match influence function computation
  pixel_pitch:       0.0083         # [m] 1m / 120 pixels = 0.0083 m/pixel (Nyquist sampling of 10cm r0)
  total_time:        1.000                 # [s]
  time_step:         0.0005                # [s] 0.5ms time steps (2 kHz)
  zenithAngleInDeg:  0.0                   # [deg] Zenith observation (0 means no airmass)
  display_server:    false                 # Disable for batch runs

# Atmospheric conditions
seeing:
  class:             'WaveGenerator'
  constant:          2.0                  # [arcsec]
  outputs:           ['output']

wind_speed:
  class:             'WaveGenerator'
  constant:          [6.6, 5.9, 5.1, 4.5, 5.1, 8.3, 16.3, 30.2, 34.3, 17.5]    # [m/s] Multi-layer wind speeds
  outputs:           ['output']

wind_direction:
  class:             'WaveGenerator'
  constant:          [38.0, 34.0, 54.0, 42.0, 68.0, 48.0, -102.0, -83.0, -77.0, 34.0] # [deg] Wind directions for each layer
  outputs:           ['output']


# Natural guide star for the WFS. Its wavelength and the pyramid wavelength must be the same (aoeb sets both).
source:
  class:             'Source'
  polar_coordinates: [0.0, 0.0]            # [arcsec, deg] On-axis NGS
  height:            .inf                  # Infinite height (star)
  magnitude:         5.00
  wavelengthInNm:    1550                   # [nm] sensing wavelength

# Telescope pupil geometry
pupilstop:
  class:             'Pupilstop'
  tag:               'dm820_1m_120pixels'

# Multi-layer atmospheric model
atmo:
  class:             'AtmoEvolution'
  simul_params_ref:  'main'
  L0:                25.0                   # [m] Outer scale
  heights:           [110, 238, 402, 728, 1381, 2686, 5296, 9066, 12836, 16136] # [m] at 0 zenith angle
  Cn2:               [0.59, 0.02, 0.04, 0.06, 0.01, 0.05, 0.09, 0.04, 0.05, 0.05]        # Cn2 fractions (sum = 1.0)
  fov:               0.0                    # [arcsec] Field of view
  inputs:
    seeing:          'seeing.output'
    wind_speed:      'wind_speed.output'
    wind_direction:  'wind_direction.output'
  outputs:           ['layer_list']

# Atmospheric propagation of both sources
prop:
  class:             'AtmoPropagation'
  simul_params_ref:  'main'
  source_dict_ref:   ['source']
  inputs:
    atmo_layer_list: ['atmo.layer_list']
    common_layer_list: ['pupilstop','dm.out_layer:-1']       # Pupil + DM correction
  outputs:           ['out_source_ef']     # FIX: was out_cource_science_ef


########################### PYR ##############################
pyr:
  class:             'ModulatedPyramid'
  simul_params_ref:  'main'
  pup_diam:          40.                     # Pupil diameter in subaps.
  pup_dist:          48.                     # Separation between pupil centers in subaps.
  fov:               10.0                    # Requested field-of-view [arcsec]
  fov_errsup:        12
  mod_amp:           3.0                     # Modulation radius (in lambda/D units)
  output_resolution: 120                     # Output sampling [usually corresponding to CCD pixels]
  wavelengthInNm:    1550                     # [nm] Pyramid wavelength
  inputs:
    in_ef: 'prop.out_source_ef'

cred:
  class:             'CCD'
  simul_params_ref:  'main'
  size:              [120,120]               # Total detector size
  dt:                0.002                   # [s] Integration time: 500 Hz = 4 loop steps
  bandw:             400                     # [nm]
  photon_noise:      true
  readout_noise:     true
  excess_noise:      false
  readout_level:     0.5                     # [e-/pix/frame]
  emccd_gain:        1                       # conventional readout: RON 0.5 e- applies as is
  quantum_eff:       0.2                     # QE x transmission
  inputs:
    in_i:            'pyr.out_i'
  outputs:           ['out_pixels']

pyr_slopes:
  class:                  'PyrSlopec'
  pupdata_object:         'pyr_pupdata_40x40'
  slopes_from_intensity:  true
  clamp_negative:         false             # keep negative (noisy) pixels: linear noise
  slopes_from_intensity:  true
  # sn_object:            'pyr3.0_40x40_sn'
  inputs:
    in_pixels:        'cred.out_pixels'
  outputs:           ['out_slopes', 'out_total_counts']

pyr_modes:
  class:             'Modalrec'
  recmat_object:     'pyr3.0_40x40_775modes_rec'
  inputs:
    in_slopes:       'pyr_slopes.out_slopes'
  outputs:           ['out_modes']


########################### SH ##############################
sh:
  class:             'SH'
  subap_on_diameter: 40                    # 40x40 subapertures across pupil
  subap_wanted_fov:  10.0                  # [arcsec] Subaperture field of view
  sensor_pxscale:    1.6667                # [arcsec/pixel] Pixel scale
  subap_npx:         6                     # 6x6 pixels per subaperture
  wavelengthInNm:    1550                   # [nm] R-band sensing
  inputs:
    in_ef:           'prop.out_source_ef'
  outputs:           ['out_i']


cred_sh:
  class:             'CCD'
  simul_params_ref:  'main'
  size:              [240,240]               # Total detector size
  dt:                0.0005                  # [s] Integration time
  bandw:             400                     # [nm]
  photon_noise:      true
  readout_noise:     true
  excess_noise:      false
  readout_level:     0.5                     # [e-/pix/frame]
  emccd_gain:        1                       # conventional readout: RON 0.5 e- applies as is
  quantum_eff:       0.2                     # QE x transmission
  inputs:
    in_i:            'sh.out_i'
  outputs:           ['out_pixels']

sh_slopes:
  class:             'ShSlopec'
  subapdata_object:  'sh_subapdata_40x40'
  clamp_negative:    false                 # keep negative (noisy) pixels: linear noise
  inputs:
    in_pixels:       'cred_sh.out_pixels'
  outputs:           ['out_slopes']

sh_modes:
  class:             'Modalrec'
  recmat_object:     'sh_40x40_775modes_rec'
  inputs:
    in_slopes:       'sh_slopes.out_slopes'
  outputs:           ['out_modes']

# # Controller
# integrator:
#   class:             'Integrator'
#   delay:             1                     # Additional controller delay [frames]. The loop itself already has a 1-step lag from dm.out_layer:-1.
#   int_gain:          [0.30]
#   n_modes:           [775]                 # Number of modes to control
#   inputs:
#     delta_comm:      'pyr_modes.out_modes'
#   outputs:           ['out_comm']

# DM data objects: aoeb names them {paths.dm_tag}_ifunc, _m2c, _kl_inv
dm:
  class:             'DM'
  simul_params_ref:  'main'
  ifunc_object:      'dm820_1m_ifunc'       # Our computed influence functions
  m2c_object:        'dm820_1m_m2c'         # Modal-to-command matrix
  nmodes:            775                    # Number of controlled modes
  height:            0                       # Ground-conjugated DM
  inputs:
    in_command:      'integrator.out_comm'
  outputs:           ['out_layer']


###########################################################
##################### POST-PROCESSING #####################

# psf:
#   class:             'PSF'
#   simul_params_ref:  'main'
#   wavelengthInNm:    1550                    # [nm] science wavelength
#   nd:                4
#   start_time:        1.0
#   inputs:
#     in_ef:           'prop.out_source_ef'
#   outputs:           ['out_psf', 'out_std_psf', 'out_sr']

res_modes:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'dm820_1m_kl_inv'
  inputs:
    in_ef: ['prop.out_source_ef']
  outputs: ['out_modes']

dm_modes:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'dm820_1m_kl_inv'
  inputs:
    in_ef: ['dm.out_layer']
  outputs: ['out_modes']

atmo_modes:
  class: 'BaseOperation'
  sub:    true
  inputs:
    in_value1: 'res_modes.out_modes'
    in_value2: 'dm_modes.out_modes'
  outputs: ['out_value']

# Data store for results
data_store:
  class:             'DataStore'
  store_dir:         '/raid1/mmenessini/results/FSOC'      # Data result directory: 'store_dir'/TN/
  inputs:
    input_list: [
                  'atmo_modes-atmo_modes.out_value',
                  'res_modes-res_modes.out_modes',
                  'dm_modes-dm_modes.out_modes',
                  'sh_modes-sh_modes.out_modes',
                  ]
