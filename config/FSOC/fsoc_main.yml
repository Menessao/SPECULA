dm:
  class:             'DM'
  simul_params_ref:  'main'
  ifunc_object:      'obs30_ifunc' #'dm468_ifunc'    # Influence functions
  m2c_object:        'obs30_m2c' #'dm468_m2c'      # Modal-to-command matrix
  height:            0                # Ground-conjugated DM
  nmodes:            400
  inputs:
    in_command:      'filter.out_comm'
  outputs:           ['out_layer']

###########################################################
##################### POST-PROCESSING #####################
# Coronagraphic and non-coronagraphic PSFs
psf:
  class:             'PSF'
  simul_params_ref:  'main'
  wavelengthInNm:    1000                 # [nm] visible
  nd:                4                    # 4x padding for PSF
  start_time:        1.0  
  verbose: true
  inputs:
    in_ef:           'ef_prop.out_ef'
  outputs:           ['out_psf', 'out_std_psf', 'out_sr']

dm_mode_res:
  class:            'ModalAnalysis'
  wavelengthInNm:    1550
  ifunc_inv_object: 'obs30_kl_inv' #'dm468_kl_inv' #'unobs_kl_inv' #
  inputs:
    in_ef: ['ef_prop.out_ef']
  outputs: ['out_modes']

atmo_modes:
  class:            'ModalAnalysis'
  wavelengthInNm:    1550
  ifunc_inv_object: 'obs30_kl_inv' #'dm468_kl_inv' #'unobs_kl_inv' #
  inputs:
    in_ef: ['prop.out_source_ngs_ef']
  outputs: ['out_modes']

# Data store for results
data_store:
  class:             'DataStore'
  store_dir:         '/raid1/mmenessini/results/FSOC'             # Data result directory: 'store_dir'/TN/
  inputs:
    input_list: [
                  'atmo_phase-prop.out_source_ngs_ef',
                  'sr-psf.out_sr',
                  'atmo_res-atmo_modes.out_modes',
                  'dm_res-dm_mode_res.out_modes',
                  'dm_cmd-filter.out_comm',
                  'pyr_modes-pyr_modalrec.out_modes',
                  ]