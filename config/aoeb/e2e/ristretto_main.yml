############################ Control: Kalman filter ################################
# Modal turbulence estimation with one AR(2) model per mode, fusing the two pyramids.
#
# Timing (SPECULA): the WFSs see at step k the DM shape d_k computed at step k-1 ('dm.out_layer:-1').
# The filter receives the raw closed-loop modal measurements and, as command input, d_k itself
# ('kpred.out_comm:-1'), whose recent history it keeps (last 4 steps), so that:
#   NIR, unmodulated, every step:          y_k = phi_k - d_k + b + n_k   (b: offset, estimated)
#   VIS, modulated reference, 500 Hz:      y_k = mean over the 4 integrated steps of (phi - d) + n_k
# It outputs E[phi_{k+1} | k]. kpred inverts the plant: its fractional delay 0.5 plus the one-step DM
# delay give d_{k+1} = 0.5 c_k + 0.5 c_{k-1}, and its IIR (1 + beta) z / (z + beta) makes d_{k+1} follow
# the filter output. The noise of each WFS is fixed at its value for the flux of the run, the aliasing is white noise added to it.
# time_step must stay set. If the plant delay, a frame rate, the flux or the AR(2) model changes, rebuild both data files (save_kalman_data).

kalman:
  class:             'KalmanFilter'
  kalman_filter_data_object: 'kf_ar2_1300modes_vis3.0_nir1.0'   # built by run_simul (save_kalman_data)
  time_step:         0.0005                  # [s] AR(2) sampling; only matters if a step has no fresh input
  gain_period:       4                       # 500 Hz / 2 kHz schedule: gains frozen once converged
  inputs:
    in_measurements_list: ['pyr_modes_vis.out_modes', 'pyr_modes_nir.out_modes']   # order of the data file
    in_command:      'kpred.out_comm:-1'     # DM command seen by the WFSs at this step
  outputs:           ['out_projected_state', 'out_state', 'out_bias']

# Plant inverse (beta = 0.99) with fractional delay 0.5: total plant delay 1 + 0.5 = 1.5 steps
# (the 1 is the 'dm.out_layer:-1' in prop)
kpred:
  class:             'IirFilter'
  delay:             0.5
  iir_filter_data_object: 'plant_inverse_1300modes'        # built by save_kalman_data (plant_inverse_tag)
  inputs:
    delta_comm:      'kalman.out_projected_state'
  outputs:           ['out_comm']

# DM data objects: aoeb names them {paths.dm_tag}_ifunc, _m2c, _kl_inv
dm:
  class:             'DM'
  simul_params_ref:  'main'
  ifunc_object:      'bmc2k_vlt_ifunc'       # Our computed influence functions
  m2c_object:        'bmc2k_vlt_m2c'         # Modal-to-command matrix
  nmodes:            1800                    # Number of controlled modes
  height:            0                       # Ground-conjugated DM
  inputs:
    in_command:      'kpred.out_comm'       # plant-inverted Kalman prediction, after the plant delay
  outputs:           ['out_layer']


###########################################################
##################### POST-PROCESSING #####################
# Coronagraphic and non-coronagraphic PSFs at the science wavelength
coro_psf_vis:
  class:             'PsfCoronagraph'
  simul_params_ref:  'main'
  wavelengthInNm:    550                    # [nm] science wavelength
  nd:                4                       # 4x padding for PSF
  start_time:        0.5
  verbose: true
  compute_profile_metrics: true
  inputs:
    in_ef:           'prop.out_science_vis_ef'

# psf_vis:
#   class:             'PSF'
#   simul_params_ref:  'main'
#   wavelengthInNm:    550                    # [nm] science wavelength
#   nd:                4
#   start_time:        1.0
#   inputs:
#     in_ef:           'prop.out_science_vis_ef'
#   outputs:           ['out_psf', 'out_std_psf', 'out_sr']

coro_psf_nir:
  class:             'PsfCoronagraph'
  simul_params_ref:  'main'
  wavelengthInNm:    1650                    # [nm] science wavelength
  nd:                4                       # 4x padding for PSF
  start_time:        0.5
  verbose: false
  compute_profile_metrics: true
  inputs:
    in_ef:           'prop.out_science_nir_ef'

# psf_nir:
#   class:             'PSF'
#   simul_params_ref:  'main'
#   wavelengthInNm:    1650                    # [nm] science wavelength
#   nd:                4
#   start_time:        1.0
#   inputs:
#     in_ef:           'prop.out_science_nir_ef'
#   outputs:           ['out_psf', 'out_std_psf', 'out_sr']

res_modes:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'bmc2k_vlt_kl_inv'
  inputs:
    in_ef: ['prop.out_science_vis_ef']
  outputs: ['out_modes']

dm_modes:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'bmc2k_vlt_kl_inv'
  inputs:
    in_ef: ['dm.out_layer']
  outputs: ['out_modes']

atmo_modes:
  class: 'BaseOperation'
  sub:    true
  inputs:
    in_value1: 'res_modes.out_modes'
    in_value2: 'dm_modes.out_modes'
  outputs: ['out_value']

# Data store for results
data_store:
  class:             'DataStore'
  store_dir:         '/raid1/mmenessini/results/WFSW'      # Data result directory: 'store_dir'/TN/
  inputs:
    input_list: [
                  'sr_vis-coro_psf_vis.out_sr',
                  'coro_psf_vis_int-coro_psf_vis.out_int_coronagraph_psf_profile',
                  # 'coro_psf_vis_std-coro_psf_vis.out_std_coronagraph_psf_profile',
                  'sr_nir-coro_psf_nir.out_sr',
                  'coro_psf_nir_int-coro_psf_nir.out_int_coronagraph_psf_profile',
                  # 'coro_psf_nir_std-coro_psf_nir.out_std_coronagraph_psf_profile',
                  'atmo_modes-atmo_modes.out_value',
                  'res_modes-res_modes.out_modes',
                  'dm_modes-dm_modes.out_modes',
                  'kf_comm-kalman.out_projected_state',
                  'kf_bias-kalman.out_bias',       # NIR offset w.r.t. the VIS reference
                  ]
