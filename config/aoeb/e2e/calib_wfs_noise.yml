main_override:
  total_time:        1.0                     # [s] 10000 NIR frames (2500 VIS): ~1% (~2%) on each variance

seeing_override:
  constant: 0.0

source_vis_override:
  magnitude:         11.00

source_nir_override:
  magnitude:         10.83


pyr_vis_override:
  pup_diam:          10.                     # Pupil diameter in subaps.
  pup_dist:          14.                     # Separation between pupil centers in subaps.

pyr_slopes_vis_override:
  pupdata_object:         'pyr_pupdata_10x10'

pyr_modes_vis_override:
  recmat_object:     'pyr2.0_10x10_wvl900_bmc2k_vlt_54modes_rec' 


pyr_nir_override:
  pup_diam:          24.                     # Pupil diameter in subaps.
  pup_dist:          30.                     # Separation between pupil centers in subaps.

pyr_slopes_nir_override:
  pupdata_object:         'pyr_pupdata_24x24'

pyr_modes_nir_override:
  recmat_object:     'pyr0.0_24x24_wvl1300_bmc2k_vlt_300modes_rec' 

prop_override:
  source_dict_ref:   ['source_vis', 'source_nir']
  inputs:
    atmo_layer_list: ['atmo.layer_list']
    common_layer_list: ['pupilstop']       # Pupil  only
  outputs:           ['out_source_vis_ef', 'out_source_nir_ef']

data_store_override:
  inputs:
    input_list: ['meas_vis-pyr_modes_vis.out_modes',       # noise-only measurements
                 'meas_nir-pyr_modes_nir.out_modes',
                 'nir_frames-cred_nir.out_pixels',          # noisy frames
                  'vis_frames-cred_vis.out_pixels',          # noisy frames
                ]

remove: ['kalman', 'kdelay', 'dm', 'dm_modes', 'atmo_modes', 'coro_psf_vis', 'coro_psf_nir','res_modes']