# Base SPECULA simulation of the Ristretto-like system. The calib_*.yml files of this folder are applied on top of it
# (`specula ristretto_main.yml calib_xxx.yml overrides.yml`) by aoeb.generation, which overrides main.root_dir, the pyramid geometry,
# the sensing wavelength (pyr.wavelengthInNm AND source_ngs.wavelengthInNm: they must be equal), the science wavelength, the DM data
# objects (from paths.dm_tag), seeing, modes, ... Adapted from the example main yml; the changes are marked with FIX.

# Main simulation parameters
main:
  class:             'SimulParams'
  root_dir:          '/raid1/mmenessini/calibration/VLT/'  # CalibManager root directory (all the data are in subdirectories); overridden by aoeb
  pixel_pupil:       220                   # Must match influence function computation
  pixel_pitch:       0.0373                # [m] 8.2m / 160 pixels = 0.0513 m/pixel (Nyquist sampling of 10cm r0)
  total_time:        10.000                 # [s]
  time_step:         0.0005                # [s] 0.5ms time steps (2 kHz)
  zenithAngleInDeg:  0.0                   # [deg] Zenith observation (0 means no airmass)
  display_server:    false                 # Disable for batch runs

# Atmospheric conditions
seeing:
  class:             'WaveGenerator'
  constant:          0.88                  # [arcsec]
  outputs:           ['output']

wind_speed:
  class:             'WaveGenerator'
  constant:          [6.6, 5.9, 5.1, 4.5, 5.1, 8.3, 16.3, 30.2, 34.3, 17.5]    # [m/s] Multi-layer wind speeds
  outputs:           ['output']

wind_direction:
  class:             'WaveGenerator'
  constant:          [38.0, 34.0, 54.0, 42.0, 68.0, 48.0, -102.0, -83.0, -77.0, 34.0] # [deg] Wind directions for each layer
  outputs:           ['output']

# Natural guide star for the WFS. Its wavelength and the pyramid wavelength must be the same (aoeb sets both).
source_ngs:
  class:             'Source'
  polar_coordinates: [0.0, 0.0]            # [arcsec, deg] On-axis NGS
  height:            .inf                  # Infinite height (star)
  magnitude:         6.0
  wavelengthInNm:    750                   # [nm] sensing wavelength (FIX: equal to pyr.wavelengthInNm)

# Telescope pupil geometry
pupilstop:
  class:             'Pupilstop'
  tag:               'vlt_pupil_220pixels'

# Multi-layer atmospheric model
atmo:
  class:             'AtmoEvolution'
  simul_params_ref:  'main'
  seed:               42
  L0:                25.0                   # [m] Outer scale
  heights:           [110, 238, 402, 728, 1381, 2686, 5296, 9066, 12836, 16136] # [m] at 0 zenith angle
  Cn2:               [0.59, 0.02, 0.04, 0.06, 0.01, 0.05, 0.09, 0.04, 0.05, 0.05]        # Cn2 fractions (sum = 1.0)
  fov:               0.0                    # [arcsec] Field of view
  inputs:
    seeing:          'seeing.output'
    wind_speed:      'wind_speed.output'
    wind_direction:  'wind_direction.output'
  outputs:           ['layer_list']

# Atmospheric propagation of both sources
prop:
  class:             'AtmoPropagation'
  simul_params_ref:  'main'
  source_dict_ref:   ['source_ngs']
  inputs:
    atmo_layer_list: ['atmo.layer_list']
    common_layer_list: ['pupilstop']       # Pupil
  outputs:           ['out_source_ngs_ef']   

atmo_modes:
  class:            'ModalAnalysis'
  ifunc_inv_object: 'bmc2k_vlt_kl_inv'
  inputs:
    in_ef: ['prop.out_source_ngs_ef']
  outputs: ['out_modes']

# Data store for results
data_store:
  class:             'DataStore'
  store_dir:         '/raid1/mmenessini/results/VLT/'      # Data result directory: 'store_dir'/TN/
  create_tn: false
  inputs:
    input_list: ['atmo_res-atmo_modes.out_modes']
